<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            border: none;
            background: white;
            color: black;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Привет 👋</h1>

        <p>
            Это мой первый сайт, который я создал
            прямо с телефона с помощью ИИ.
        </p>

        <button class="button" onclick="showMessage()">
    Нажми меня →
</button>
    </div>

    <script>
        function sayHello() {
            alert("Ты только что запустил свой первый сайт! 🚀");
        }
    </script>
<script>
    function showMessage() {
        alert("Спасибо, что заглянул! 🚀");
    }
</script>
</body>
</html>
